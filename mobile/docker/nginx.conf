server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Send relative Locations. Left on, nginx builds an absolute URL out of
  # server_name and drops the port with it, so a redirect from :5180 lands on
  # plain localhost and the link dies. Relative means the browser keeps
  # whatever host, port and scheme it already had, which is right on a laptop,
  # on the LAN, and behind a proxy alike.
  absolute_redirect off;

  # Each app is a single-page Flutter build, so an unknown path inside its
  # folder has to fall back to that app's own index.html. Falling back to the
  # site root instead would answer /cashier/whatever with the diner app.
  location /customer/ { try_files $uri $uri/ /customer/index.html; }
  location /cashier/  { try_files $uri $uri/ /cashier/index.html; }
  location /admin/    { try_files $uri $uri/ /admin/index.html; }

  # There is no page at the root.
  #
  # There used to be a chooser listing the three apps, which was convenient
  # while building and wrong everywhere else: it put the counter and the
  # owner's dashboard one tap from anybody who opened the address. It also
  # swallowed confirmation links — Supabase sends somebody to the site root
  # with ?code=..., and a page that does nothing with that code is a diner
  # told to check their email and then shown a menu of staff apps.
  #
  # The root now forwards to the diner app, query string intact, so the code
  # reaches something that can spend it. The staff apps stay at their own
  # paths for whoever is meant to be there.
  location = / { return 302 /customer/$is_args$args; }

  # The APK. Without the explicit type Android receives it as octet-stream and
  # some browsers refuse to hand it to the package installer.
  # Served from the volume the apk service writes to, so the site image never
  # has to contain a 50MB binary or wait for the Android build.
  location = /download/bencris.apk {
    alias /usr/share/nginx/html/apk/bencris.apk;
    types { }
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="bencris.apk"';
  }

  # A stale service worker or main.dart.js is how a phone keeps showing an old
  # build after a rebuild, which reads as "the fix did not work".
  location ~* \.(js|json|wasm)$ {
    add_header Cache-Control "no-cache, must-revalidate";
  }
}

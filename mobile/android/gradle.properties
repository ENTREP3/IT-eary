org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Kotlin's incremental compiler cannot reliably close its cache files on
# Windows: every plugin module failed with "Could not close incremental caches",
# identically, and it recurred immediately after a clean — so it is the
# mechanism, not a stale directory.
#
# A release build recompiles everything from nothing regardless, so incremental
# compilation has nothing to offer it and this costs no build time that was
# being saved.
kotlin.incremental=false
